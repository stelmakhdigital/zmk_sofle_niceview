# Sleep configuration
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y

# Encoders support
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n

# Enable support to control external power output
CONFIG_ZMK_EXT_POWER=n

# RGB underglow support
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# 5 minutes timeout for RGB auto-off
CONFIG_ZMK_IDLE_TIMEOUT=300000

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

CONFIG_ZMK_USB=n

CONFIG_ZMK_BLE=y

# Increase BT power for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable experimental BLE connection support
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Enable KSCAN driver debug logs
CONFIG_KSCAN_LOG_LEVEL_DBG=n

# I2C Configuration
CONFIG_I2C=y

# ==== ДИАГНОСТИКА ТАЧПАДА ====
# Включаем отладочные логи для I2C
CONFIG_I2C_LOG_LEVEL_DBG=y

# Включаем отладочные логи для драйвера Azoteq
CONFIG_INPUT_LOG_LEVEL_DBG=y

# Включаем общие логи для отладки
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y